# Model pricing for token-cost metrics (per 1M tokens).
#
# Cost is CACHE-AWARE (ADR-014, supersedes ADR-011's full-rate formula):
#   cost = fresh_input * input_per_1m
#        + cache_writes * cache_write_per_1m
#        + cache_reads  * cached_input_per_1m
#        + output       * output_per_1m
# where fresh_input = total_prompt_tokens - cache_reads - cache_writes.
# A missing cache rate falls back to input_per_1m (conservative, never a silent
# discount). The cache-free ceiling is NOT stored — it is derivable from the
# recorded token_usage as input * input_per_1m + output * output_per_1m.
#
# cache_write_per_1m for Anthropic models is the 1-hour cache write rate
# (2x base input) — the mode Claude Code uses; verified against Harbor's own
# per-step cost accounting on the 2026-07 grid. OpenAI bills no write premium,
# so gpt entries omit the field (writes fall back to the base input rate).
#
# Cache reads are 0.1x the base input rate on MOST Claude models, but there are
# two published per-model exceptions — neither is a typo, do NOT "unify" them:
#   * Claude Fable 5.1 (and Mythos 5.1): 0.025x — $0.25/MTok on $10/MTok input
#   * Claude Opus 5.5 and Claude Sonnet 5.5: 0.05x — $0.20 on $4, $0.10 on $2
# Both are stated in footnotes on the official pricing page. Our runs are
# cache-read heavy (93–98% of input), so a wrong multiplier here moves the
# headline cost figure directly.
#
# Claude Haiku 5.5 is deliberately ABSENT and unsupported: it is the only
# current Claude model with tiered pricing ($0.10/$0.50 per 1M for prompts up
# to 100K tokens, $0.50/$2.50 above), and ModelPrice has no notion of a tier.
# A single rate would understate cost ~5x at our prompt sizes, so a trial on
# claude-haiku-5-5 reports cost_usd = null plus a warning rather than a wrong
# number. Add it only together with tier support.
#
# Claude models re-verified 2026-10-14 against the official pricing page (every
# pre-existing rate unchanged since 2026-09-04; Opus 5.5 and Sonnet 5.5 added)
# — CONFIRM before publishing any cost figures. gpt entries not re-checked
# since 2026-06-08.

