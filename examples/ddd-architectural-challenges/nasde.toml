[project]
name = "ddd-architectural-challenges"
version = "1.0.0"

[defaults]
variant = "claude-vanilla"

[docker]
base_image = "ubuntu:22.04"
build_commands = []

[evaluation]
# Published results (CALIBRATION_*.md, assets/) were produced on earlier models;
# every trial records its exact agent + judge model. To rerun that setup, use tag v0.7.0.
model = "claude-opus-5-5"
dimensions_file = "assessment_dimensions.json"
skills_dir = "./evaluator_skills"
max_turns = 60  # = current default; explicit here as a reminder DDD-rich workspaces need headroom

[reporting]
platform = "opik"
project_name = "ddd-architectural-challenges"
